name: panvimdoc
on:
  push:
    branches: [main]
    paths:
      - README.md
      - .github/workflows/panvimdoc.yml
permissions:
  contents: write
jobs:
  docs:
    runs-on: ubuntu-latest
    name: pandoc to vimdoc
    steps:
      - uses: actions/checkout@v2
      - name: panvimdoc
        uses: kdheepak/panvimdoc@main
        with:
          vimdoc: my-plugin-name        # required: your plugin's name, no .txt
          version: "Neovim >= 0.8.0"    # shown in the doc header
          demojify: true                # strip emojis, they don't render in vim
          treesitter: true              # syntax-highlight code blocks
          toc: true                     # generate a table of contents
      - uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: "docs: auto-generate vimdoc"
          branch: ${{ github.head_ref }}
